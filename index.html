<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="德文學習">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>德文學習與文法測驗</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頂部功能選單 (Dropdown) -->
  <div class="menu-container">
    <div class="mode-select-wrap">
      <select class="mode-select" id="modeSelect">
        <option value="card">📖 單字卡 (Flashcards)</option>
        <option value="quiz">✍️ 單字與複數測驗 (Vokabeltest)</option>
        <option value="verb">⚡ 動詞三態測驗 (Verbformen)</option>
        <option value="ndekl">🧩 弱變化名詞測驗 (n-Deklination)</option>
      </select>
      <div class="select-arrow">▼</div>
    </div>
  </div>

  <!-- 單字課程範圍篩選列 (L1 / L2) -->
  <div class="sub-filter-bar" id="lessonFilterBar">
    <button class="filter-btn active" data-lesson="all">全部單字</button>
    <button class="filter-btn" data-lesson="L1">第 1 課 (Lektion 1)</button>
    <button class="filter-btn" data-lesson="L2">第 2 課 (Lektion 2)</button>
  </div>

  <!-- 動詞模式專屬：難度/範圍選單 -->
  <div class="sub-filter-bar hidden" id="verbFilterBar">
    <button class="filter-btn active" data-level="all">全部動詞 (A1–B1)</button>
    <button class="filter-btn" data-level="A1-2">基礎 (A1–A2: 1–10頁)</button>
    <button class="filter-btn" data-level="B1">進階 (B1: 11–13頁)</button>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="status-text" id="status">進度載入中...</div>

  <!-- 1. 單字卡模式 -->
  <div class="section-view" id="cardSection">
    <div class="card-options-bar">
      <button class="opt-toggle-btn" id="flipModeToggleBtn">⇄ 正反翻轉：德文正面</button>
    </div>

    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <div class="card-face card-front">
          <span class="page-tag" id="pageTag">載入中</span>
          <button class="btn-audio" id="audioBtnFront" title="德語發音">🔊</button>
          <div class="word" id="frontWord">...</div>
          <div class="hint" id="frontHint">點擊翻面看中文</div>
        </div>
        <div class="card-face card-back">
          <button class="btn-audio" id="audioBtnBack" style="display:none;" title="德語發音">🔊</button>
          <div class="meaning" id="backMeaning">...</div>
          <div class="hint" id="backHint">點擊翻回德文</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-ctrl btn-secondary" id="prevBtn">上一張</button>
      <button class="btn-ctrl btn-secondary" id="shuffleBtn">洗牌</button>
      <button class="btn-ctrl" id="nextBtn">下一張</button>
    </div>
  </div>

  <!-- 2. 單字拼寫與複數測驗 -->
  <div class="section-view hidden" id="quizSection">
    <div class="quiz-card">
      <span class="page-tag" id="quizPageTag">載入中</span>
      <button class="btn-audio" id="quizAudioBtn" style="display:none;" title="德語發音">🔊</button>
      <div class="quiz-question" id="quizPrompt">...</div>

      <input type="text" class="input-box" id="quizInput" placeholder="請輸入單字（名詞需包含冠詞）..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

      <div class="char-bar">
        <button class="char-btn" data-char="ä">ä</button>
        <button class="char-btn" data-char="ö">ö</button>
        <button class="char-btn" data-char="ü">ü</button>
        <button class="char-btn" data-char="ß">ß</button>
        <button class="char-btn" data-char="Ä">Ä</button>
        <button class="char-btn" data-char="Ö">Ö</button>
        <button class="char-btn" data-char="Ü">Ü</button>
      </div>

      <div class="plural-section" id="pluralSection" style="display: none;">
        <div class="plural-title">選擇此名詞的複數形式：</div>
        <div class="plural-options" id="pluralOptions"></div>
      </div>

      <div class="result-box" id="resultBox"></div>
    </div>

    <div class="controls">
      <button class="btn-ctrl" id="submitBtn">送出檢查</button>
      <button class="btn-ctrl" id="nextQuizBtn" style="display:none;">下一題</button>
    </div>
  </div>

  <!-- 3. 動詞三態變化測驗 -->
  <div class="section-view hidden" id="verbSection">
    <div class="quiz-card">
      <span class="page-tag" id="verbPageTag">動詞測驗</span>
      <button class="btn-audio" id="verbAudioBtn" style="display:none;" title="德語發音">🔊</button>
      
      <div class="verb-infinitive" id="verbInfinitive">sehen</div>
      <div class="verb-meaning" id="verbMeaning">看, 看法</div>

      <div class="verb-form-group">
        <label>1. 現在式第三人稱 (Präsens: er/sie/es)</label>
        <input type="text" class="input-box" id="inputPraesens" placeholder="例如：sieht 或 er sieht" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="verb-form-group">
        <label>2. 過去式 (Präteritum)</label>
        <input type="text" class="input-box" id="inputPraeteritum" placeholder="例如：sah" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="verb-form-group">
        <label>3. 現在完成式 (Perfekt / Partizip II)</label>
        <input type="text" class="input-box" id="inputPerfekt" placeholder="例如：hat gesehen / ist gegangen" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="char-bar">
        <button class="char-btn" data-char="ä">ä</button>
        <button class="char-btn" data-char="ö">ö</button>
        <button class="char-btn" data-char="ü">ü</button>
        <button class="char-btn" data-char="ß">ß</button>
      </div>

      <div class="result-box" id="verbResultBox"></div>
    </div>

    <div class="controls">
      <button class="btn-ctrl" id="submitVerbBtn">送出檢查</button>
      <button class="btn-ctrl" id="nextVerbBtn" style="display:none;">下一題</button>
    </div>
  </div>

  <!-- 4. 弱變化練習 Section (n-Deklination) -->
  <div class="section-view hidden" id="ndeklSection">
    <div class="quiz-card">
      <span class="page-tag" id="ndeklPageTag">n-Deklination</span>
      <button class="btn-audio" id="ndeklAudioBtn" style="display:none;" title="德語發音">🔊</button>
      
      <div class="quiz-question" id="ndeklSentence">載入中...</div>

      <div class="verb-form-group">
        <label>請輸入空格中的變化形式：</label>
        <input type="text" class="input-box" id="ndeklInput" placeholder="請輸入變化後的名詞..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="char-bar">
        <button class="char-btn" data-char="ä">ä</button>
        <button class="char-btn" data-char="ö">ö</button>
        <button class="char-btn" data-char="ü">ü</button>
        <button class="char-btn" data-char="ß">ß</button>
        <button class="char-btn" data-char="Ä">Ä</button>
        <button class="char-btn" data-char="Ö">Ö</button>
        <button class="char-btn" data-char="Ü">Ü</button>
      </div>

      <div class="result-box" id="ndeklResultBox"></div>
    </div>

    <div class="controls">
      <button class="btn-ctrl" id="submitNdeklBtn">送出檢查</button>
      <button class="btn-ctrl" id="nextNdeklBtn" style="display:none;">下一題</button>
    </div>
  </div>

  <footer class="app-footer">
    Author : Noitaiva1160
  </footer>

  <!-- 模組化腳本載入 -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
