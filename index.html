<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 針對 iPhone 螢幕與安全區域優化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 支援 iOS Web App 全螢幕模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="德文單字">
  <title>德文單字卡 - Lektion 1</title>
  <style>
    :root {
      --primary: #2d5a88;
      --secondary: #1a365d;
      --background: #f0f3f6;
      --card-bg: #ffffff;
      --text: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--background);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      touch-action: pan-y;
    }

    header {
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.35rem;
      color: var(--secondary);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .progress-bar-container {
      width: 100%;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
      height: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.25s ease;
    }

    .status-text {
      font-size: 0.85rem;
      color: #718096;
    }

    /* 3D 卡片結構 */
    .card-container {
      perspective: 1000px;
      width: 100%;
      max-width: 420px;
      height: 290px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.35, 1, 0.35, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border-radius: 20px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
      background: #fafafa;
    }

    .page-tag {
      position: absolute;
      top: 18px;
      left: 18px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #edf2f7;
      padding: 4px 10px;
      border-radius: 8px;
      color: #4a5568;
    }

    .btn-audio {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #edf2f7;
      border: none;
      font-size: 1.2rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .word {
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.35;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .meaning {
      font-size: 1.25rem;
      font-weight: 500;
      color: #1a202c;
      line-height: 1.6;
      padding: 0 8px;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      font-size: 0.78rem;
      color: #a0aec0;
    }

    /* 手機按鈕 */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      width: 100%;
      max-width: 420px;
    }

    button.btn-ctrl {
      border: none;
      padding: 13px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--primary);
      color: #fff;
    }

    button.btn-ctrl:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    button.btn-shuffle {
      background-color: #edf2f7;
      color: #4a5568;
      flex: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Lektion 1 單字學習</h1>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status-text" id="status">第 1 / 28 個單字</div>
  </header>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="card-face card-front">
        <span class="page-tag" id="pageTag">S. 3</span>
        <button class="btn-audio" id="audioBtn" title="德語發音">🔊</button>
        <div class="word" id="frontWord">das Bulgarien</div>
        <div class="hint">點擊翻面看中文（支援左右滑動）</div>
      </div>
      <div class="card-face card-back">
        <div class="meaning" id="backMeaning">保加利亞</div>
        <div class="hint">點擊翻回正面</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-ctrl" id="prevBtn">上一張</button>
    <button class="btn-ctrl btn-shuffle" id="shuffleBtn">隨機洗牌</button>
    <button class="btn-ctrl" id="nextBtn">下一張</button>
  </div>

  <script>
    const rawVocabulary = [
      { page: "S. 3", de: "das Bulgarien (ohne Artikel)", zh: "保加利亞", clean: "Bulgarien" },
      { page: "S. 3", de: "unterstützen", zh: "支持, 支援", clean: "unterstützen" },
      { page: "S. 3", de: "aufmerksam", zh: "引起注意的、體貼的/貼心的、專注的", clean: "aufmerksam" },
      { page: "S. 3", de: "j-n auf etw. (A) aufmerksam machen", zh: "[Wendung] 提醒某人注意某事", clean: "jemanden auf etwas aufmerksam machen" },
      { page: "S. 3", de: "ernst", zh: "嚴肅的、危急的/嚴重的", clean: "ernst" },
      { page: "S. 3", de: "frech", zh: "頑皮的/調皮的、放肆的", clean: "frech" },
      { page: "S. 4", de: "intelligent", zh: "聰明的、有智慧的", clean: "intelligent" },
      { page: "S. 4", de: "kritisch", zh: "批判的、危急的、[新聞]極重要的", clean: "kritisch" },
      { page: "S. 4", de: "realistisch", zh: "實際的、現實的", clean: "realistisch" },
      { page: "S. 4", de: "treu", zh: "忠誠的、忠貞的、忠心的", clean: "treu" },
      { page: "S. 4", de: "der/die Arme, -n", zh: "可憐之人/可憐蟲、窮人", clean: "der Arme" },
      { page: "S. 5", de: "ebenso... wie ...", zh: "如同...一般、既...又...", clean: "ebenso wie" },
      { page: "S. 5", de: "der/die Glückliche, -n", zh: "幸運的人/幸運兒、幸福的人", clean: "der Glückliche" },
      { page: "S. 5", de: "die Lebensfreude (Sg.)", zh: "生命的喜悅、對生活的熱愛、樂天精神", clean: "die Lebensfreude" },
      { page: "S. 5", de: "die Nachhilfe (Sg.)", zh: "課後輔導、補習", clean: "die Nachhilfe" },
      { page: "S. 5", de: "das Vorbild, -er", zh: "榜樣、典範", clean: "das Vorbild" },
      { page: "S. 5", de: "einige", zh: "有幾個、一些", clean: "einige" },
      { page: "S. 6", de: "der Konkurrent, -en / die Konkurrentin, -nen", zh: "競爭者、競爭對手", clean: "der Konkurrent" },
      { page: "S. 6", de: "der/die Ordentliche, -n", zh: "井然有序的人、愛整齊的人、有規矩的人", clean: "der Ordentliche" },
      { page: "S. 6", de: "der Respekt (Sg.)", zh: "尊重、欽佩、尊敬/敬佩", clean: "der Respekt" },
      { page: "S. 7", de: "fleißig", zh: "認真的、努力的/用功的", clean: "fleißig" },
      { page: "S. 7", de: "lustig", zh: "有趣的、搞笑的、好玩的", clean: "lustig" },
      { page: "S. 7", de: "abschwächen", zh: "弱化/緩和(語義或語調)", clean: "abschwächen" },
      { page: "S. 7", de: "die Mensa, Mensen/Mensas", zh: "學生餐廳", clean: "die Mensa" },
      { page: "S. 7", de: "die Vorlesung, -en", zh: "大學講座課、大學演講課", clean: "die Vorlesung" },
      { page: "S. 9", de: "wirken", zh: "產生作用、顯得/看起來/給人印象", clean: "wirken" },
      { page: "S. 9", de: "die Charaktereigenschaft, -en", zh: "個性特質/性格特質", clean: "die Charaktereigenschaft" },
      { page: "S. 9", de: "der Mitbewohner, - / die Mitbewohnerin, -nen", zh: "室友、樓友", clean: "der Mitbewohner" }
    ];

    let vocabList = [...rawVocabulary];
    let currentIndex = 0;

    const card = document.getElementById('card');
    const cardContainer = document.getElementById('cardContainer');
    const frontWord = document.getElementById('frontWord');
    const backMeaning = document.getElementById('backMeaning');
    const pageTag = document.getElementById('pageTag');
    const statusText = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const audioBtn = document.getElementById('audioBtn');

    function updateCard() {
      card.classList.remove('flipped');
      const item = vocabList[currentIndex];
      setTimeout(() => {
        frontWord.textContent = item.de;
        backMeaning.textContent = item.zh;
        pageTag.textContent = item.page;
        statusText.textContent = `第 ${currentIndex + 1} / ${vocabList.length} 個單字`;
        progressBar.style.width = `${((currentIndex + 1) / vocabList.length) * 100}%`;
      }, 120);
    }

    // 翻牌
    cardContainer.addEventListener('click', (e) => {
      if (e.target.closest('#audioBtn')) return;
      card.classList.toggle('flipped');
    });

    // 上一張 / 下一張
    function goPrev() {
      currentIndex = (currentIndex - 1 + vocabList.length) % vocabList.length;
      updateCard();
    }
    function goNext() {
      currentIndex = (currentIndex + 1) % vocabList.length;
      updateCard();
    }

    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    // 隨機排列
    shuffleBtn.addEventListener('click', () => {
      for (let i = vocabList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [vocabList[i], vocabList[j]] = [vocabList[j], vocabList[i]];
      }
      currentIndex = 0;
      updateCard();
    });

    // iOS 發音支援
    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const utterance = new SpeechSynthesisUtterance(vocabList[currentIndex].clean);
      utterance.lang = 'de-DE';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    });

    // iPhone 手勢滑動支援 (Swipe Left / Swipe Right)
    let touchStartX = 0;
    let touchEndX = 0;

    cardContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    cardContainer.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      if (Math.abs(diffX) > 50) {
        if (diffX < 0) {
          goNext(); // 向左滑：下一張
        } else {
          goPrev(); // 向右滑：上一張
        }
      }
    }

    updateCard();
  </script>
</body>
</html>
